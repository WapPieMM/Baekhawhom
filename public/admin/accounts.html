<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e9"><title>จัดการไอดี | Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/config.js"></script><link rel="stylesheet" href="/assets/css/admin.css"><script defer src="/assets/js/admin-accounts.js"></script></head>
<body><main class="admin-shell"><header class="admin-head"><a href="/">← กลับหน้าร้าน</a><div><span class="eyebrow">CREAMY GOTHIC · CONTROL PANEL</span><h1>จัดการ Account</h1></div><button id="logoutBtn" class="button ghost" hidden>ออกจากระบบ</button></header>
<section id="loginPanel" class="panel login-panel"><h2>เข้าสู่ระบบผู้ดูแล</h2><p>ใช้บัญชีผู้ดูแลที่กำหนดสิทธิ์ admin ใน Supabase</p><form id="loginForm"><label>อีเมล<input name="email" type="email" required autocomplete="username"></label><label>รหัสผ่าน<input name="password" type="password" required autocomplete="current-password"></label><button class="button" type="submit">เข้าสู่ระบบ</button><p class="message" id="loginMessage" role="status"></p></form></section>
<section id="managerPanel" hidden>
<div class="stats"><article class="panel"><small>ไอดีทั้งหมด</small><strong id="totalCount">0</strong></article><article class="panel"><small>พร้อมขาย</small><strong id="availableCount">0</strong></article><article class="panel"><small>ขายแล้ว</small><strong id="soldCount">0</strong></article></div>
<div class="manager-layout"><section class="panel"><div class="panel-title"><h2 id="formTitle">เพิ่มไอดีใหม่</h2><button id="resetBtn" class="button ghost" type="button">ล้างฟอร์ม</button></div>
<form id="accountForm"><input type="hidden" name="id"><label>ชื่อไอดี<input name="title" maxlength="100" required placeholder="เช่น ไอดีสกินหายาก"></label>
<div class="form-row"><label>หมวดหมู่<select name="category"><option value="chicken_skin">ไอดีไก่สกิน</option><option value="normal">ไอดีปกติ</option></select></label><label>สถานะ<select name="status"><option value="available">พร้อมขาย</option><option value="sold">ขายแล้ว</option></select></label></div>
<label>ราคา (บาท)<input name="price" type="number" min="0" step="0.01" required value="0"></label><label>รายละเอียด<textarea name="description" rows="4" maxlength="1500" placeholder="รายละเอียดไอดี"></textarea></label><label>URL รูปภาพ<input name="image_url" type="url" placeholder="https://..."></label><div class="form-actions"><button class="button" type="submit">บันทึกไอดี</button><p class="message" id="formMessage" role="status"></p></div></form></section>
<section class="panel inventory"><div class="panel-title"><h2>รายการไอดีในร้าน</h2><button id="refreshBtn" class="button ghost" type="button">รีเฟรช</button></div><div class="filters"><select id="categoryFilter"><option value="">ทุกหมวดหมู่</option><option value="chicken_skin">ไอดีไก่สกิน</option><option value="normal">ไอดีปกติ</option></select><select id="statusFilter"><option value="">ทุกสถานะ</option><option value="available">พร้อมขาย</option><option value="sold">ขายแล้ว</option></select></div><div id="accountList" class="account-list"><p class="muted">กำลังโหลด...</p></div></section></div></section>
<footer>ข้อมูลรายการจะแสดงที่หน้า <a href="/accounts">/accounts</a> โดยอัตโนมัติ</footer></main></body></html>
